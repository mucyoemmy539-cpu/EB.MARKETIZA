<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller Dashboard — E&B MARKETIZA</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><div class="brand">🛒 <span>E&B</span> MARKETIZA</div><nav><a href="index.html">Marketplace</a><button id="logout" class="link-button">Log out</button></nav></header>
<main class="dashboard"><div class="dash-head"><div><p class="eyebrow">SELLER CENTER</p><h1>Seller Dashboard</h1><p id="welcome">Manage your shop.</p></div><button id="addProduct" class="btn">+ Add product</button></div>
<section class="stats"><div><b id="productCount">0</b><span>Products</span></div><div><b>0</b><span>Orders</span></div><div><b>0</b><span>Sales</span></div></section>
<section class="panel"><div class="section-head"><h2>Your products</h2></div><div id="sellerProducts" class="product-grid"></div><p id="sellerEmpty" class="empty">You have no products yet.</p></section></main>
<div id="productModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><h2 id="modalTitle">Add product</h2>
<form id="productForm"><input type="hidden" id="productId"><label>Product name<input id="productName" required maxlength="80"></label><label>Price (SEK)<input id="productPrice" type="number" min="0" step="0.01" required></label><label>Stock<input id="productStock" type="number" min="0" step="1" required></label><label>Description<textarea id="productDescription" rows="4" maxlength="500"></textarea></label><label>Product image<input id="productImage" type="file" accept="image/*"></label><img id="imagePreview" class="preview hidden" alt="Product preview"><button class="btn" type="submit">Save product</button><div id="productMessage" class="message"></div></form></div></div>
<script src="config.js"></script>
<script type="module" src="supabaseClient.js"></script>
<script type="module" src="dashboard.js"></script>
</body></html>
